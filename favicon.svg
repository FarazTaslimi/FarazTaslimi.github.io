<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- FT monogram — canonical logo, same as the FT Brand Badge pen -->
  <defs>
    <linearGradient id="tile" x1="0.2" y1="0" x2="0.54" y2="1">
      <stop offset="0" stop-color="#191b28"/>
      <stop offset="1" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e879f9"/>
      <stop offset=".5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="17.6" fill="url(#tile)"/>
  <rect x="0.91" y="0.91" width="62.18" height="62.18" rx="16.69" fill="none" stroke="url(#ring)" stroke-width="1.82"/>
  <rect width="64" height="64" rx="17.6" fill="url(#sheen)"/>
  <g fill="#f4f5f8">
    <rect x="13.3" y="18.8" width="35.4" height="5.4" rx="2.7"/>
    <rect x="13.3" y="18.8" width="5.4" height="27.4" rx="2.7"/>
    <rect x="13.3" y="29.3" width="14.9" height="5.4" rx="2.7"/>
    <rect x="35.3" y="18.8" width="5.4" height="27.4" rx="2.7"/>
  </g>
  <circle cx="50" cy="13.5" r="4.6" fill="url(#glow)"/>
  <circle cx="50" cy="13.5" r="5" fill="#7dd3fc" opacity=".22"/>
  <circle cx="50" cy="13.5" r="2.4" fill="#7dd3fc"/>
</svg>
